[project]
name = "mjmeasure"
version = "0.1.0"
description = "Browser-based inspection and measurement tools for MuJoCo scenes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mjviser>=0.0.13",
    "mujoco==3.7.0",
    "numpy>=1.24",
    "rtree>=1.3",
    "trimesh>=4.0",
    "viser>=1.0",
]

[project.urls]
Repository = "https://github.com/abc-hands/mjmeasure"

[project.scripts]
mjmeasure = "mjmeasure.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjmeasure"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
